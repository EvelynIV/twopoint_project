[project]
name = "twopoint-project"
version = "0.1.0"
description = ""
authors = [
    {name = "wcy",email = "wcy@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [

    "opencv-python-headless (>=4.13.0.92,<5.0.0.0)",

    "pygobject (==3.48.2)",

    "onnxruntime (==1.20.1)",

    "python-dotenv (>=1.2.2,<2.0.0)",

    "pyserial (>=3.5,<4.0)",

    "python-periphery (>=2.4.1,<3.0.0)",

    "aiortc (>=1.15.0,<2.0.0)",

    "aiohttp (>=3.14.1,<4.0.0)",

    "typer (>=0.26.8,<0.27.0)",
]
[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"
[tool.poetry]
packages = [{include = "twopoint_project", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
